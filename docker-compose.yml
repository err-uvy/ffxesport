services:
  postgres:
    image: postgres:16-alpine
    container_name: ffx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ffx_esports
      POSTGRES_USER: ffx
      POSTGRES_PASSWORD: ffx_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ffx -d ffx_esports"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ffx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "4000:4000"

  socket-server:
    build:
      context: .
      dockerfile: apps/socket-server/Dockerfile
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    ports:
      - "4100:4100"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - .env
    depends_on:
      - api
      - socket-server
    ports:
      - "3000:3000"

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    env_file:
      - .env
    depends_on:
      - api
    ports:
      - "3001:3001"

volumes:
  postgres_data:
  redis_data:
